  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account</title>
  <link rel="icon" href="./imges/Screenshot_2026-05-22-22-11-54-080.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./Css/sign.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

  <div class="signup-box">

    <h2>Create <span>Account</span></h2>
    <p class="subtitle">Choose your account type to get started.</p>

    <!-- Toggle -->
    <div class="toggle">
      <button class="active" id="userBtn">👤 Traveler</button>
      <button id="hostBtn">🏡 Host</button>
    </div>

    <!-- Form -->
    <form id="signupForm">

      <div class="row">
        <div class="col-6">
          <label>First Name</label>
          <input type="text" placeholder="Jane" id="firstName" required>
        </div>

        <div class="col-6">
          <label>Last Name</label>
          <input type="text" placeholder="Doe" id="lastName" required>
        </div>
      </div>

      <label>Email Address</label>
      <input type="email" placeholder="you@example.com" id="email" required>

      <label>Password</label>
      <input type="password" placeholder="Min 8 characters" id="password" required>

     <button type="submit" class="main-btn">Create Account</button>

      <p class="login-link">
        Already have an account? <a href="login.html">Log In</a>
      </p>

    </form>

  </div>

</div>
<script src="./JavaScript/lang.js"></script>
<script src="./JavaScript/sign.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 <script src="./JavaScript/hidden.js" type="text/javascript" charset="utf-8"></script>
</body>
</html>
