<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="./imges/Screenshot_2026-05-22-22-11-54-080.png" type="image/png">
  <link rel="stylesheet" href="./Css/login.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

  <div class="login-box">

    <h2>Welcome <span>Back</span></h2>
    <p class="subtitle">Login to your account</p>

    <form id="loginForm">

      <label>Email Address</label>
      <input type="email" placeholder="you@example.com" id="email" required>

      <label>Password</label>
      <input type="password" placeholder="Enter your password" id="password" required>

<button type="submit" class="main-btn">Login</button>

      <p class="signup-link">
        Don’t have an account?
        <a href="./sign.html">Sign Up</a>
      </p>

    </form>

  </div>

</div>
<script src="./JavaScript/lang.js"></script>
<script src="./JavaScript/login.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 <script src="./JavaScript/hidden.js" type="text/javascript" charset="utf-8"></script>
</body>
</html>
